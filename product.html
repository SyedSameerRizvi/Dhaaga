<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHAAGA®</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dhaaga-theme')||'white'}catch(e){}</script>
<link rel="stylesheet" href="site.css">
<style>
.pdp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;padding:18px var(--gut) 0;align-items:start}
.pdp__img{position:sticky;top:84px;aspect-ratio:4/5;max-height:calc(100svh - 110px);width:100%;background:var(--soft);overflow:hidden}
.pdp__img img{display:block;width:100%;height:100%;object-fit:cover;animation:in 1.2s var(--ease) backwards}
.pdp.is-out .pdp__img img{filter:grayscale(1);opacity:.6}
.pdp__body{animation:up 1s var(--ease) .1s backwards}
.is-settled .pdp__img img,.is-settled .pdp__body{animation:none}
@keyframes in{from{opacity:0;transform:scale(1.04)}}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.back{display:inline-flex;align-items:center;gap:10px;font-size:13px;padding:8px 0}
.back:hover{text-decoration:underline}
.pdp h1{margin:6px 0 22px;font-weight:400;font-size:clamp(46px,7.2vw,112px);line-height:.88;letter-spacing:-.045em}
.pdp__price{font-size:clamp(26px,3vw,40px);letter-spacing:-.03em;margin:0 0 20px}
.pdp__desc{font-size:clamp(17px,1.6vw,21px);line-height:1.25;letter-spacing:-.015em;margin:0 0 26px;max-width:26em}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:64px;border-bottom:2px solid var(--ink);font-size:20px;letter-spacing:-.02em}
.row fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 6px}
.row label{position:relative}
.row input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.row label span{display:inline-block;min-width:44px;padding:10px 8px;text-align:center}
.row input:checked+span{background:var(--ink);color:var(--bg)}
.row input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.row input:disabled{cursor:default}
.row input:disabled+span{text-decoration:line-through;opacity:.45}
.step{display:flex;align-items:center;gap:26px;font-size:30px}
.step button{width:44px;height:56px;border:0;background:none;cursor:pointer;font-size:38px;font-weight:300;line-height:1;padding:0}
.step button:disabled{opacity:.3;cursor:default}
.step output{min-width:1.2em;text-align:center}
.pdp .btn{margin-top:26px;min-height:72px;font-size:24px}
.pdp__note{font-size:13px;margin:14px 0 0;color:var(--muted)}
.pdp__looks{margin-top:34px;font-size:15px}
.pdp__looks a{text-decoration:underline;text-underline-offset:3px}
.missing{padding:80px var(--gut);font-size:24px}
@media (max-width:799px){
  .pdp{grid-template-columns:1fr;gap:18px}
  .pdp__img{position:static;max-height:none}
  .row{font-size:17px;min-height:58px}
}
</style>
</head>
<body>
<div id="site-top"></div>
<main id="main"></main>
<div id="site-foot"></div>

<script src="store.js"></script>
<script>
(() => {
'use strict';
const {P, LOOKS, fmt, esc} = Store;
const $ = (s, r = document) => r.querySelector(s);
Store.mountChrome('');
const id = new URLSearchParams(location.search).get('id');
const p = Object.prototype.hasOwnProperty.call(P, id) ? P[id] : null; // id comes from the URL: only accept known products
const main = $('#main');
if (!p) { main.innerHTML = '<p class="missing">That piece could not be found. <a href="index.html#shop" style="text-decoration:underline">Return to shop</a></p>'; return; }
document.title = `${p.name} | DHAAGA®`;

let size = null, qty = 1;
const inBag = s => (Store.bag().find(x => x.pid === p.id && x.size === s) || {qty: 0}).qty;
const left = s => Math.max(0, Math.min(20, Store.qty(p.id, s)) - inBag(s)); // how many more of this size can be added

function render() {
  const out = !Store.available(p.id);
  if (!size || !left(size)) size = p.sizes.find(s => left(s) > 0) || null;
  const max = size ? left(size) : 0; qty = Math.max(1, Math.min(qty, max || 1));
  const looks = LOOKS.filter(L => L.items.includes(p.id)).map(L => esc(L.name));
  main.innerHTML = `<article class="pdp${out ? ' is-out' : ''}">
    <div class="pdp__img"><img src="${p.img}" alt="${esc(p.name)}"></div>
    <div class="pdp__body">
      <a class="back" href="index.html#shop"><svg width="18" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M25 7H1M7 1L1 7l6 6"/></svg>Return to Shop</a>
      <h1>${esc(p.name)}</h1>
      <p class="pdp__price">${fmt(p.price)}</p>
      <p class="pdp__desc">${esc(p.desc || '')}</p>
      <div class="row" style="border-top:2px solid var(--ink)"><span>Fabric</span><span>${esc(p.cat.split('·').pop().trim())}</span></div>
      <div class="row"><span id="size-l">${esc(p.legend)}</span><fieldset aria-labelledby="size-l">${p.sizes.map(s =>
        `<label><input type="radio" name="size" value="${s}"${s === size ? ' checked' : ''}${Store.qty(p.id, s) > 0 ? '' : ' disabled'}><span>${s}</span></label>`).join('')}</fieldset></div>
      <div class="row"><span>Quantity</span><div class="step"><button data-q="-1" aria-label="One less"${qty <= 1 ? ' disabled' : ''}>−</button><output aria-live="polite">${qty}</output><button data-q="1" aria-label="One more"${qty >= max ? ' disabled' : ''}>+</button></div></div>
      <button class="btn btn--block" data-add${max ? '' : ' disabled'}>${out ? 'Sold out' : max ? 'Add to Bag' : 'All available stock is in your bag'}</button>
      <p class="pdp__note">${out ? 'This piece is sold out for now.' : size && Store.qty(p.id, size) <= 3 ? `Only ${Store.qty(p.id, size)} left in ${esc(size)}.` : 'Cash on Delivery · Free delivery over Rs 5,000 · 7-day size exchange'}</p>
      ${looks.length ? `<p class="pdp__looks">Styled in ${looks.join(', ')}. <a href="runway.html">Try the Look →</a></p>` : ''}
    </div></article>`;
}
main.addEventListener('change', e => { if (e.target.name === 'size') { size = e.target.value; qty = 1; render(); $(`input[value="${CSS.escape(size)}"]`, main)?.focus(); } });
main.addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (q) { qty += +q.dataset.q; render(); $(`[data-q="${q.dataset.q}"]`, main)?.focus(); return; }
  if (!e.target.closest('[data-add]') || !size) return;
  const n = qty, s = size; qty = 1; // reset first: addToBag re-renders through store:change
  const added = n - Store.addToBag(Array.from({length: n}, () => ({pid: p.id, size: s}))).length;
  Store.toast(added ? `${added} × ${p.name} (${s}) added to your bag` : `Sorry, no more ${p.name} in ${s}`);
});
addEventListener('store:change', render);
render();
main.addEventListener('animationend', () => main.classList.add('is-settled'), {once: true}); // entrance plays once, not on every re-render
})();
</script>
</body>
</html>
