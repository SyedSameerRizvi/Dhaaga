<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Try the Look — DHAAGA</title>
<meta name="description" content="Six looks, styled head to toe. Plain shirts, trousers and shoes, made in Pakistan. Explore the runway and tap a pin to shop the piece.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('dhaaga-theme')||'white'}catch(e){}</script>
<link rel="stylesheet" href="site.css">
<style>
/* ---------- section ---------- */
.rw{--panel-w:380px;display:block;position:relative;-webkit-font-smoothing:antialiased;background:var(--bg);--model-h:560px}
.rw__sticky{height:var(--frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
.rw__left{position:relative;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;z-index:5}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-weight:700;font-size:56px;line-height:.92;letter-spacing:-.045em}
.rw__sub{margin:0;font-size:12px;line-height:1.55;color:var(--muted);max-width:46ch}
.rw__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:0;overflow:hidden;z-index:0}
.rw.is-dragging .rw__stage{cursor:grabbing}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.rw__actors{position:absolute;inset:0;transition:opacity .7s var(--ease) .2s}
.rw__model{position:absolute;left:0;bottom:0;padding:0;border:0;background:none;cursor:pointer;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__model img,.rw__lb-model img{display:block;height:var(--model-h);width:calc(var(--model-h) * .5625);pointer-events:none;-webkit-user-drag:none;position:relative}
.rw__model:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.rw__shadow{position:absolute;left:50%;bottom:0;width:110%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);pointer-events:none;
  background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__sweep{position:absolute;inset:0;z-index:1550;pointer-events:none;mix-blend-mode:soft-light;overflow:hidden}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;width:42%;opacity:0;transform:translateX(-130%) skewX(-12deg);
  background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent)}
.rw__stage.is-sweep .rw__sweep::before{animation:rw-sweep 1.5s cubic-bezier(.65,0,.35,1)}
@keyframes rw-sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}
.rw__walk{display:none}

/* custom cursor */
.rw--cursor .rw__stage,.rw--cursor .rw__stage *{cursor:none}
.rw__cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:1700;pointer-events:none}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  border:1px solid color-mix(in srgb,var(--text) 28%,transparent);background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(6px);
  opacity:0;transform:scale(.3);transition:transform .6s var(--ease),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor-in span{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;transition:opacity .25s,letter-spacing .7s var(--ease)}
.rw__cursor .cv{opacity:0}
.rw__cursor.is-on .rw__cursor-in{opacity:1;transform:scale(1)}
.rw__cursor.is-view .cd{opacity:0}.rw__cursor.is-view .cv{opacity:1}
.rw__cursor.is-link .rw__cursor-in{transform:scale(.2);background:var(--accent);border-color:transparent}
.rw__cursor.is-link span{opacity:0}
.rw.is-dragging .rw__cursor-in{transform:scale(.74);background:var(--accent);border-color:var(--accent);color:var(--bg)}
.rw.is-dragging .rw__cursor .cd{opacity:1;letter-spacing:.42em}.rw.is-dragging .rw__cursor .cv{opacity:0}

/* controls */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5}
.rw__icon{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;cursor:pointer;flex:0 0 auto}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--ease),opacity .4s}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s var(--bounce)}
.rw__icon[data-prev]:hover svg{transform:translateX(-4px)}.rw__icon[data-next]:hover svg{transform:translateX(4px)}
.rw__icon:active svg{transform:scale(.88)}
.rw__icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.rw__auto .i-pause,.rw.is-playing .rw__auto .i-play{display:none}.rw.is-playing .rw__auto .i-pause{display:block}
.rw__ticks{flex:1;display:flex;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;border:0;background:none;padding:0;color:var(--muted);text-align:left;cursor:pointer;
  transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:var(--text)}
.rw__tick:hover{color:var(--text)}
.rw__tick-bar{display:block;height:2px;width:100%;overflow:hidden;background:color-mix(in srgb,var(--text) 14%,transparent);transition:transform .5s var(--ease)}
.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar::after{content:"";display:block;height:100%;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);background:var(--accent)}
.rw.is-playing .rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(0);transition:none}
.rw.is-playing .rw__tick.is-run .rw__tick-bar::after{animation:rw-fill 5s linear forwards}
@keyframes rw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rw__tick-label{font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--ease) .1s backwards}
@keyframes rw-name-in{from{opacity:0;letter-spacing:.34em}}

/* panel */
.rw__panel{position:relative;background:var(--bg);border-left:1px solid var(--line);min-height:0}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px 32px 18px}
.rw__panel-title{margin:0;font-weight:400;font-size:18px;line-height:1.1}
.rw__label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rw__label.is-swap{animation:rw-fade .8s var(--ease)}
@keyframes rw-fade{from{opacity:0;transform:translateY(6px)}}
.rw__mhead{display:none}
.rw__items{list-style:none;margin:0;padding:6px 32px 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.rw__item:last-child{border-bottom:1px solid var(--line)}
.rw__item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--ease)}
.rw__item.is-hot::after{transform:scaleX(1)}
.rw__media{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:color-mix(in srgb,var(--text) 5%,var(--bg))}
.rw__media img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.rw__num{color:#01411C;position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.9);font-size:10px;font-weight:600;
  transition:background .3s,color .3s,transform .45s var(--bounce)}
.rw__item.is-hot .rw__num{background:var(--accent);color:var(--bg);transform:scale(1.12)}
@media (hover:hover){
  .rw__item:hover::after{transform:scaleX(1)}
  .rw__item:hover .rw__media img{transform:scale(1.07)}
  .rw__item:hover .rw__num{background:var(--accent);color:var(--bg);transform:scale(1.12)}
  .rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}
}
.rw__tag{position:absolute;top:11px;left:8px;z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,var(--text) 50%,transparent)}
.rw__tag span{background:var(--ink);color:var(--bg);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
@keyframes rw-swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:none}}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{font-size:13px;font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--ease)}
.rw__item:hover .rw__name{background-size:100% 1px}
.rw__price{font-size:12px}

.rw__add{position:relative;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;cursor:pointer;align-self:end}
.rw__add svg{grid-area:1/1;transition:transform .55s var(--bounce),opacity .2s}
.rw__add .chk,.rw__add .spin{opacity:0}
.rw__add::before,.rw__add::after{content:"";position:absolute;inset:4px;border-radius:20px;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--ease),opacity .4s;pointer-events:none}
.rw__add:hover::before,.is-picking .rw__add::before{opacity:.22;transform:scale(1)}
.is-picking .rw__add .plus{transform:rotate(45deg)}
.is-loading .rw__add .plus{opacity:0}
.is-loading .rw__add .spin{opacity:1;animation:rw-spin .8s linear infinite}
.is-loading .rw__media::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.5) 50%,transparent 70%);animation:rw-shimmer 1.1s infinite}
.is-added .rw__add{cursor:default}
.is-added .rw__add .plus{opacity:0}
.is-added .rw__add .chk{opacity:1;color:var(--accent);animation:rw-pop .6s var(--bounce)}
.is-added .rw__add .chk path{stroke-dasharray:24;stroke-dashoffset:24;animation:rw-draw .7s var(--ease) .1s forwards}
.is-added .rw__add::before{opacity:0}
.is-added .rw__add::after{border-color:var(--accent);animation:rw-burst 1s var(--ease) forwards}
@keyframes rw-spin{to{transform:rotate(360deg)}}
@keyframes rw-shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes rw-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rw-draw{to{stroke-dashoffset:0}}
@keyframes rw-burst{from{transform:scale(.55);opacity:.9}to{transform:scale(1.7);opacity:0}}

/* sold out */
.rw__item.is-soldout .rw__media img{filter:grayscale(1);opacity:.45}
.rw__item.is-soldout .rw__add{opacity:.25;cursor:default}
.rw__price .chip{margin-left:6px;padding:3px 6px;font-size:9px}
.rw__pill input:disabled{cursor:default}
.rw__pill input:disabled+span{color:var(--muted);border-color:var(--line);background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}

/* size picker */
.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:rw-drop .7s var(--ease)}
.rw__picker .rw__opt{animation:rw-rise .8s var(--ease) backwards}
.rw__picker .rw__confirm{animation:rw-rise .8s var(--ease) .16s backwards}
@keyframes rw-drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes rw-rise{from{opacity:0;transform:translateY(14px)}}
.rw__picker-head{display:none}
.rw__opt{border:0;padding:0;margin:0;min-width:0}
.rw__opt legend{font-size:11px;margin-bottom:8px;padding:0}
.rw__pills{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative}
.rw__pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rw__pill span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:30px;border:1px solid var(--line);font-size:11px;
  transition:background .3s,color .3s,border-color .3s,transform .45s var(--spring)}
.rw__pill:hover span{border-color:var(--text)}
.rw__pill input:checked+span{background:var(--text);color:var(--bg);border-color:var(--text)}
.rw__pill:active span{transform:scale(.94)}
.rw__pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rw__confirm,.rw__cta{position:relative;overflow:hidden;border:0;border-radius:0;background:var(--green);color:var(--bg);font-weight:500;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rw__confirm{min-height:46px;font-size:11px;gap:10px;transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
.rw__confirm::before,.rw__cta::before{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;transform:translateX(-140%) skewX(-18deg);background:linear-gradient(100deg,transparent,rgb(255 255 255/.26) 50%,transparent)}
.rw__confirm:hover,.rw__cta:hover{transform:translateY(-1px)}
.rw__confirm:hover::before,.rw__cta:hover::before{transform:translateX(260%) skewX(-18deg);transition:transform 1.1s var(--ease)}

/* bundle */
.rw__bundle{padding:20px 32px 30px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);background:var(--bg)}
.rw__msg{margin:0;font-size:11px;line-height:1.45;color:var(--accent);animation:rw-rise .6s var(--ease)}
.rw__msg:empty{display:none}
.rw__bundle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rw__bundle-copy{display:flex;flex-direction:column;gap:3px}
.rw__bundle-title{font-size:13px;font-weight:500}
.rw__bundle-note{font-size:11px;color:var(--muted)}
.rw__bundle-price{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.rw__bundle-price s{font-size:11px;color:var(--muted)}
.rw__bundle-price strong{font-weight:400;font-size:16px}
.rw__cta{min-height:56px;width:100%;font-size:13px;gap:12px;transition:transform .6s var(--ease),background .45s,color .45s,box-shadow .6s var(--ease)}
.rw__cta:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px color-mix(in srgb,var(--text) 80%,transparent)}
.rw__cta:active{transform:scale(.985)}
.rw__cta .arrow{transition:transform .5s var(--bounce)}
.rw__cta:hover .arrow{transform:translateX(4px)}
.rw__cta .spin,.rw__cta .cta-m,.rw__cta .cta-done{display:none}
.rw__cta.is-loading .arrow{display:none}
.rw__cta.is-loading .spin{display:block;animation:rw-spin .8s linear infinite}
.is-complete .rw__cta{background:var(--accent);animation:rw-glow 1.8s var(--ease);cursor:default}
.is-complete .rw__cta .cta-add,.is-complete .rw__cta .cta-m,.is-complete .rw__cta .arrow{display:none!important}
.is-complete .rw__cta .cta-done{display:inline;animation:rw-rise .7s var(--ease)}
@keyframes rw-glow{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}

/* row entrance */
.rw__panel.is-in .rw__item{animation:rw-item-in 1.1s var(--ease) backwards;animation-delay:calc(var(--i) * 85ms + 140ms)}
.rw__panel.is-in .rw__media{animation:rw-curtain 1.2s var(--ease) backwards;animation-delay:calc(var(--i) * 85ms + 200ms)}
.rw__panel.is-in .rw__media img{animation:rw-media-in 1.8s var(--ease) backwards;animation-delay:calc(var(--i) * 85ms + 200ms)}
.rw__panel.is-in .rw__bundle-row{animation:rw-rise 1s var(--ease) .38s backwards}
.rw__panel.is-in .rw__cta{animation:rw-rise 1s var(--ease) .46s backwards}
@keyframes rw-item-in{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
@keyframes rw-curtain{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes rw-media-in{from{transform:scale(1.22);filter:saturate(.4) brightness(1.08)}}

/* lightbox */
.rw__lb{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s linear .95s}
.rw__lb::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .6s var(--ease) .15s}
.rw--zoom .rw__lb{visibility:visible;pointer-events:auto;transition:none}
.rw--zoom .rw__lb::before{opacity:1;transition:opacity .45s}
.rw--zoom .rw__actors,.rw--zoom .rw__head,.rw--zoom .rw__walk{opacity:0;pointer-events:none;transition:opacity .35s}
.rw__head,.rw__walk{transition:opacity .7s var(--ease) .2s}
.rw__lb-stage{position:absolute;inset:88px 48px 48px;display:flex;align-items:flex-end;justify-content:center;cursor:zoom-out}
.rw__lb-model{position:relative;flex:0 0 auto;cursor:default;transition:transform .95s var(--ease)}
.rw__lb-model img{height:100%;width:100%}
.rw__lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:32px 32px 0 56px;
  opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s}
.rw--zoom .rw__lb-top{opacity:1;transform:none;transition:opacity .8s .35s,transform 1s var(--ease) .35s}
.rw__lb-cap{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.rw__lb-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.rw__lb-name{font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__lb-close{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  border:1px solid color-mix(in srgb,var(--text) 22%,transparent);background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);transition:transform .6s var(--ease),border-color .6s}
.rw__lb-close:hover{transform:rotate(90deg);border-color:var(--text)}
.rw__lb-hint{position:absolute;bottom:16px;left:0;right:0;margin:0;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);pointer-events:none;opacity:0}
.rw--zoom .rw__lb-hint{opacity:1;transition:opacity 1s var(--ease) 1.1s}
.rw__pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer;z-index:2}
.rw__pin-dot{color:#01411C;position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.86);backdrop-filter:blur(6px);
  font-size:11px;font-weight:600;line-height:1;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);transition:transform .5s var(--bounce),background .25s,color .25s;
  animation:rw-pin-in .9s var(--spring) backwards;animation-delay:calc(var(--pi) * 110ms + .6s)}
.rw__pin-dot::after,.rw__pin-dot::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.8);animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.rw__pin-dot::before{border-color:rgb(255 255 255/.55);animation-delay:1.3s}
.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{transform:scale(1.3);background:#01411C;color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent),0 8px 20px -6px rgb(0 0 0/.45)}
.rw__pin:focus-visible{outline:0}
.rw__pin:focus-visible .rw__pin-dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.rw__pin::after{color:#01411C;content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border-radius:999px;
  background:rgb(255 255 255/.88);backdrop-filter:blur(10px);font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);
  opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left;transition:opacity .35s,transform .6s var(--ease);pointer-events:none}
.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}

<script>
(() => {

  const st = b.el.style;

  closePicker();
  const p = P[li.dataset.pid], key = keyOf(li), inStock = s => Store.qty(p.id, s) > 0;
  const sel = SEL[key] && inStock(SEL[key]) ? SEL[key] : p.sizes.find(inStock);
  if (!sel) return; // whole product sold out
  const html = `<div class="rw__picker"><div class="rw__picker-head"><img src="${p.img}" alt=""><div><b>${p.name}</b><span>${fmt(p.price)}</span></div>` +
    `<button data-pick-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>` +
    `<fieldset class="rw__opt"><legend>${p.legend}</legend><div class="rw__pills">${p.sizes.map(s =>
      `<label class="rw__pill"><input type="radio" name="sz-${p.id}" value="${s}"${s === sel ? ' checked' : ''}${inStock(s) ? '' : ' disabled'}><span>${s}</span></label>`).join('')}</div></fieldset>` +
    `<button class="rw__confirm" data-confirm>Add to bag<span class="rw__sr"> — ${p.name}</span></button></div>`;
  const host = mobile ? sheetBody : li;
  host.insertAdjacentHTML('beforeend', html);
  picker = {li, key, mobile, el: host.lastElementChild};
  li.classList.add('is-picking'); $('[data-add]', li).setAttribute('aria-expanded', 'true');
  if (mobile) { sheet.hidden = false; requestAnimationFrame(() => sheet.classList.add('is-open')); root.classList.add('rw--picking'); }
  else reveal(li);
  $('input:checked', picker.el).focus({preventScroll: true});
}
function closePicker(refocus) {
  if (!picker) return;
  const {li, el} = picker; picker = null;
  el.remove(); li.classList.remove('is-picking');
  const btn = $('[data-add]', li); if (btn) btn.setAttribute('aria-expanded', 'false');
  sheet.hidden = true; sheet.classList.remove('is-open'); root.classList.remove('rw--picking');
  if (refocus && btn && li.isConnected) btn.focus({preventScroll: true});
}
function addRows(lis, btn) {
  lis.forEach(li => li.classList.add('is-loading')); if (btn) btn.classList.add('is-loading');
  setTimeout(() => { // short delay so the spinner reads as "saving"
    const size = li => SEL[keyOf(li)] || P[li.dataset.pid].sizes.find(s => Store.qty(li.dataset.pid, s) > 0);
    const failed = Store.addToBag(lis.map(li => ({pid: li.dataset.pid, size: size(li)})));
    if (failed.length) msg.textContent = 'Not enough stock for: ' + failed.join(', ');
    const ok = lis.filter(li => !failed.includes(P[li.dataset.pid].name));
    lis.filter(li => !ok.includes(li)).forEach(li => li.classList.remove('is-loading'));
    if (ok.length) Store.toast(ok.length > 1 ? 'Look added to your bag' : 'Piece added to your bag');
    lis = ok;
    lis.forEach(li => { ADDED.add(keyOf(li)); li.classList.remove('is-loading', 'is-picking'); li.classList.add('is-added');
      const b = $('[data-add]', li); b.setAttribute('aria-label', 'Added to bag: ' + P[li.dataset.pid].name); b.removeAttribute('aria-expanded'); });
    if (btn) btn.classList.remove('is-loading');
    if (!RM && navigator.vibrate && mobile) navigator.vibrate(12);
    checkComplete();
  }, RM ? 0 : 450);
}
function addAll() {
  if (panel.classList.contains('is-complete') || cta.classList.contains('is-loading')) return;
  msg.textContent = '';
  const open = $$('.rw__item:not(.is-soldout)', list).filter(li => !li.classList.contains('is-added'));
  const ready = open.filter(li => TOUCHED.has(keyOf(li))), pending = open.filter(li => !TOUCHED.has(keyOf(li)));
  if (ready.length) addRows(ready, cta);
  if (pending.length) { // never guess sizes
    msg.textContent = 'Pick a size for: ' + pending.map(li => P[li.dataset.pid].name).join(', ');
    openPicker(pending[0]);
  }
}

/* ---------- lightbox ---------- */
const frontBody = () => bodies.find(b => rank(b.a) === 0);
const at = (a, b) => `translate3d(${a.left - b.left}px,${a.bottom - b.bottom}px,0) scale(${a.height / b.height})`;
function openLB() {
  engage(); clearTimeout(lbTimer); $$('.is-hot', root).forEach(e => e.classList.remove('is-hot'));
  const L = LOOKS[index];
  lbStage.innerHTML = `<div class="rw__lb-model"><span class="rw__shadow"></span><img src="${L.img}" alt="${L.name}">` +
    L.items.map((id, k) => { const [x, y] = PIN[P[id].kind];
      return `<button class="rw__pin" data-n="${k + 1}" data-tip="${P[id].name}" style="left:${x}%;top:${y}%;--pi:${k + 1}" aria-label="${k + 1}: ${P[id].name}"><span class="rw__pin-dot">${k + 1}</span></button>`; }).join('') + '</div>';
  $('.rw__lb-kicker', lb).textContent = 'Look 0' + (index + 1);
  $('.rw__lb-name', lb).textContent = L.name;
  const m = lbStage.firstElementChild, sr = lbStage.getBoundingClientRect(), h = Math.max(160, Math.min(sr.height, sr.width / .5625));
  m.style.height = h + 'px'; m.style.width = h * .5625 + 'px';
  root.classList.add('rw--zoom'); lb.setAttribute('aria-hidden', 'false');
  const fb = frontBody();
  if (!RM && fb) { // FLIP: grow from the runway spot
    m.style.transition = 'none'; m.style.transformOrigin = '0 100%';
    m.style.transform = at($('img', fb.el).getBoundingClientRect(), m.getBoundingClientRect());
    void m.offsetWidth; m.style.transition = ''; m.style.transform = '';
  }
  $('[data-lb-close]', lb).focus({preventScroll: true});
}
function closeLB() {
  if (!root.classList.contains('rw--zoom')) return;
  const m = lbStage.firstElementChild, fb = frontBody();
  if (!RM && m && fb) m.style.transform = at($('img', fb.el).getBoundingClientRect(), m.getBoundingClientRect());
  const hadFocus = lb.contains(document.activeElement);
  root.classList.remove('rw--zoom'); lb.setAttribute('aria-hidden', 'true');
  lbTimer = setTimeout(() => { lbStage.innerHTML = ''; }, 950);
  if (hadFocus) stage.focus({preventScroll: true});
}

/* ---------- clicks ---------- */
function onClick(e) {
  if (e.target.closest('.rw__lb') && !e.target.closest('.rw__lb-model, button')) return closeLB();
  const t = e.target.closest('button'); if (!t) return;
  if (t.closest('.rw__panel, #sheet')) engage();
  if (t.matches('[data-pick-close]')) return closePicker(true);
  if (t.matches('[data-lb-close]')) return closeLB();
  if (t.matches('[data-next]')) return next();
  if (t.matches('[data-prev]')) return prev();
  if (t.matches('[data-tick]')) return go(+t.dataset.tick);
  if (t.matches('[data-auto]')) { if (!playing) engaged = false; return play(!playing); }
  if (t.matches('.rw__pin')) { engage(); return hot(+t.dataset.n, true); }
  if (t.matches('.rw__model')) { const k = rank(+t.dataset.a); return k === 0 ? openLB() : moveTo(Math.round(target) + k); }
  if (t.matches('[data-confirm]') && picker) { const li = picker.li; TOUCHED.add(picker.key); closePicker(); return addRows([li]); }
  if (t.matches('[data-add]')) { const li = t.closest('.rw__item'); if (li.classList.contains('is-added') || li.classList.contains('is-loading')) return;
    return picker && picker.li === li ? closePicker() : openPicker(li); }
  if (t.matches('[data-all]')) return addAll();
}
function onChange(e) {
  if (!picker || !e.target.matches('input[type=radio]')) return;
  engage(); SEL[picker.key] = e.target.value; TOUCHED.add(picker.key);
}
root.addEventListener('click', onClick); sheet.addEventListener('click', onClick);
root.addEventListener('change', onChange); sheet.addEventListener('change', onChange);
panel.addEventListener('pointerover', e => { const li = e.target.closest('.rw__item'); if (e.pointerType === 'mouse' && li && !li.classList.contains('is-hot')) hot(+li.dataset.n); });
panel.addEventListener('pointerout', e => { const li = e.target.closest('.rw__item'); if (li && !li.contains(e.relatedTarget)) li.classList.remove('is-hot'); });
panel.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') panelHover = true; });
panel.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { panelHover = false; restartBar(); } });

/* ---------- drag / swipe / wheel / keys ---------- */
let ds = null, suppressUntil = 0, wheelAcc = 0, wheelLock = 0;
stage.addEventListener('pointerdown', e => {
  if ((e.pointerType === 'mouse' && e.button !== 0) || root.classList.contains('rw--zoom')) return;
  ds = {x: e.clientX, y: e.clientY, t: target, id: e.pointerId, s: [{x: e.clientX, t: e.timeStamp}], drag: false, dead: false};
});
stage.addEventListener('pointermove', e => {
  moveCursor(e);
  if (!ds || e.pointerId !== ds.id || ds.dead) return;
  if (e.pointerType === 'mouse' && !e.buttons) return endDrag(e);
  const dx = e.clientX - ds.x, dy = e.clientY - ds.y;
  if (!ds.drag) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > 1.2 * Math.abs(dy)) { ds.drag = dragging = true; root.classList.add('is-dragging'); stage.setPointerCapture(e.pointerId); }
    else { if (Math.abs(dy) > 10) ds.dead = true; return; }
  }
  ds.s.push({x: e.clientX, t: e.timeStamp}); if (ds.s.length > 6) ds.s.shift();
  target = ds.t - dx / unit; kick();
});
function endDrag(e) {
  const d = ds; ds = null;
  if (!d || !d.drag) return;
  dragging = false; root.classList.remove('is-dragging'); suppressUntil = performance.now() + 60;
  const dx = e.clientX - d.x, f = d.s[0], l = d.s[d.s.length - 1], vx = l.t > f.t ? (l.x - f.x) / (l.t - f.t) : 0, from = Math.round(d.t);
  if (mobile) return moveTo(Math.abs(dx) > 30 || Math.abs(vx) > .3 ? from - Math.sign(dx || -vx) : from);
  let i = Math.round(target - vx * 160 / unit);
  if (i === from && Math.abs(vx) > .3) i = from - Math.sign(vx);
  moveTo(clamp(i, from - 2, from + 2));
}
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', e => { if (performance.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
stage.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault(); if (performance.now() < wheelLock) return;
  wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 45) { wheelAcc > 0 ? next() : prev(); wheelAcc = 0; wheelLock = performance.now() + 520; }
}, {passive: false});
stage.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); } else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (picker) closePicker(true); else closeLB(); });

/* ---------- custom cursor ---------- */
let cx = 0, cy = 0, tx = 0, ty = 0, craf = 0;
if (FINE) root.classList.add('rw--cursor'); else cursor.remove();
function moveCursor(e) {
  if (!FINE || e.pointerType !== 'mouse') return;
  const r = stage.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top;
  if (!cursor.classList.contains('is-on')) { cx = tx; cy = ty; cursor.classList.add('is-on'); }
  const m = !dragging && e.target.closest('.rw__model'), front = m && rank(+m.dataset.a) === 0;
  cursor.classList.toggle('is-view', !!front); cursor.classList.toggle('is-link', !!m && !front);
  if (!craf) craf = requestAnimationFrame(stepCursor);
}
function stepCursor() {
  craf = 0; const f = RM ? 1 : .18; cx += (tx - cx) * f; cy += (ty - cy) * f;
  cursor.style.transform = `translate3d(${cx}px,${cy}px,0)`;
  if (Math.hypot(tx - cx, ty - cy) > .2) craf = requestAnimationFrame(stepCursor);
}
stage.addEventListener('pointerleave', () => cursor.classList.remove('is-on', 'is-link', 'is-view'));

/* ---------- lifecycle ---------- */
root.classList.add('rw--js');
new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) kick(); }, {threshold: 0}).observe(root);
if (RM) root.classList.add('is-revealed');
else { const io = new IntersectionObserver(([en]) => { if (en.isIntersecting) { io.disconnect(); requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-revealed'))); } }, {threshold: 0, rootMargin: '0px 0px -22% 0px'}); io.observe(root); }
document.addEventListener('visibilitychange', kick);
addEventListener('storage', () => { if (!picker) renderPanel(false); }); // stock edited in another tab (admin)
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 120); });
new ResizeObserver(() => measure()).observe(stage);
measure(); setIndex(0);
if (!RM) play(true);
})();
</script>
</body>
</html>
